<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selorah Health | The OS for Health Records</title>
    <meta name="description" content="Selorah Health gives patients ownership of their medical records. Encrypted, portable, and shared only when you choose." />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/og-image.png" />

    <!-- Open Graph: absolute image URL required for X/Twitter and Facebook -->
    <meta property="og:site_name" content="Selorah Health" />
    <meta property="og:title" content="Selorah Health | The OS for Health Records" />
    <meta property="og:description" content="Own your health records. Share with clinics when you need to, not forever." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://selorah.vercel.app/" />
    <meta property="og:image" content="https://selorah.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://selorah.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Selorah Health" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@selorahealth" />
    <meta name="twitter:title" content="Selorah Health | The OS for Health Records" />
    <meta name="twitter:description" content="Own your health records. Share with clinics when you need to, not forever." />
    <meta name="twitter:image" content="https://selorah.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Selorah Health" />

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,fr',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body class="bg-gray-50 font-sans text-gray-900">
    <div id="google_translate_element" style="display:none"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
