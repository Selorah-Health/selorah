<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Selorah Health | The OS for Health Records</title>
    <meta name="description" content="Selorah Health gives patients ownership of their medical records. Encrypted, portable, and shared only when you choose." />
    <meta name="theme-color" content="#6183FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Selorah" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('selorah_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          // The app still works without a saved theme.
        }
      })();
    </script>
    <!-- Open Graph: absolute image URL required for X/Twitter and Facebook -->
    <meta property="og:site_name" content="Selorah Health" />
    <meta property="og:title" content="Selorah Health | The OS for Health Records" />
    <meta property="og:description" content="Own your health records. Share with clinics when you need to, not forever." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.selorah.app/" />
    <meta property="og:image" content="https://www.selorah.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.selorah.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Selorah Health" />
    <meta property="og:locale" content="en_US" />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@selorahealth" />
    <meta name="twitter:title" content="Selorah Health | The OS for Health Records" />
    <meta name="twitter:description" content="Own your health records. Share with clinics when you need to, not forever." />
    <meta name="twitter:image" content="https://www.selorah.app/og-image.png" />
    <meta name="twitter:image:alt" content="Selorah Health" />
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,fr',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" async defer src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
      #selorah-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fe;
        transition: opacity 0.35s ease;
      }
      #selorah-splash img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      #selorah-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="bg-gray-50 font-sans text-gray-900">
    <div id="selorah-splash" aria-hidden="true">
      <img src="/logo.png" alt="" />
    </div>
    <script>
      (function () {
        var splash = document.getElementById('selorah-splash');
        function hideSplash() {
          if (!splash) return;
          splash.classList.add('is-hiding');
          window.setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        }
        // The app removes the splash after React mounts. If a cached chunk is
        // missing, keep a calm message visible instead of showing a blank page.
        window.__selorahHideSplash = hideSplash;
        window.setTimeout(function () {
          if (!splash || splash.classList.contains('is-hiding')) return;
          splash.innerHTML =
            '<div style="text-align:center;font-family:Sora,system-ui,sans-serif;padding:24px">' +
            '<img src="/logo.png" alt="" style="width:96px;height:96px;object-fit:contain;margin:0 auto 16px" />' +
            '<p style="margin:0;color:#101217;font-size:15px;font-weight:700">Still opening Selorah</p>' +
            '<p style="margin:6px 0 0;color:#6B7280;font-size:12px;line-height:1.6;max-width:260px">Check your connection. Your last saved pages will open once the app finishes loading.</p>' +
            '</div>';
        }, 6000);
      })();
    </script>
    <div id="google_translate_element" style="display:none"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
